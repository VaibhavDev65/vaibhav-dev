<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaibhav.Dev | Project Portal</title>
    <style>
        :root { --bg: #0b0e14; --glass: rgba(255, 255, 255, 0.05); --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; }
        .portal-container { background: var(--glass); backdrop-filter: blur(10px); border-radius: 15px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { background: none; border: 1px solid #ff4444; color: #ff4444; padding: 8px 15px; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        .logout-btn:hover { background: #ff4444; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        th { color: var(--accent); text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .status-pending { color: #ffcc00; }
        .status-working { color: #00d2ff; cursor: pointer; text-decoration: underline; }
        .status-done { color: #00ff88; }
        .status-denied { color: #ff4444; }
        .name-link { color: #fff; cursor: pointer; font-weight: bold; }
        .name-link:hover { color: var(--accent); }
        
        /* Modal Style */
        #msgModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1f2b; padding: 25px; border-radius: 15px; border: 1px solid var(--accent); z-index: 100; box-shadow: 0 0 30px rgba(0, 0, 0, 0.7); text-align: center; min-width: 250px; }
        #msgModal button { background: var(--accent); border: none; color: black; padding: 8px 20px; border-radius: 5px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        select { background: #1a1f2b; color: white; border: 1px solid var(--accent); border-radius: 4px; padding: 5px; outline: none; }
    </style>
</head>
<body>

    <div class="nav-header">
        <h2 id="welcomeText">Project Tracking System</h2>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <div class="portal-container">
        <table id="portalTable">
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Query</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="msgModal">
        <h4 style="margin-top:0; color:var(--accent);">Update from Vaibhav</h4>
        <p id="statusText"></p>
        <button onclick="document.getElementById('msgModal').style.display='none'">Got it!</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, onSnapshot, doc, updateDoc, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIG: Screenshot waali keys yahan hain
        const firebaseConfig = { 
            apiKey: "AIzaSyD7deMPfPe2tD5QzIt_TOvl61t5826NXso",
            authDomain: "vaibhav-portfolio-917a9.firebaseapp.com",
            projectId: "vaibhav-portfolio-917a9",
            storageBucket: "vaibhav-portfolio-917a9.firebasestorage.app",
            messagingSenderId: "906198813981",
            appId: "1:906198813981:web:d035936e843814666425f4",
            measurementId: "G-9149SXZZY5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 1. Auth & Role Handling
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                // Role check local storage se
                const role = localStorage.getItem("userRole");
                document.getElementById('welcomeText').innerText = role === "admin" ? "Admin Dashboard" : "My Project Status";
                loadPortalData(user.email, role);
            }
        });

        // 2. Random Status Messages for Clients
        const statusMessages = {
            "working": ["Server setup in progress...", "Coding the frontend architecture.", "Integrating database API.", "Designing the UI components."],
            "done": ["Project is live!", "Final files delivered.", "Maintenance mode active.", "Optimization complete."],
            "pending": ["Request under review.", "Waiting for initial discussion.", "Checking resource availability."]
        };

        // 3. Load Data dynamically
        function loadPortalData(email, role) {
            let q;
            if (role === "admin") {
                q = query(collection(db, "proposals"), orderBy("timestamp", "desc"));
            } else {
                q = query(collection(db, "proposals"), where("clientEmail", "==", email));
            }

            onSnapshot(q, (snapshot) => {
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = "";
                snapshot.docs.forEach((docSnap, index) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleDateString() : "Just now";

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td class="name-link" onclick="location.href='details.html?id=${docId}'">${data.clientName}</td>
                        <td>${data.clientEmail}</td>
                        <td>${data.projectType}</td>
                        <td>${date}</td>
                        <td>${renderStatusCell(docId, data.status, role)}</td>
                    `;
                    tableBody.appendChild(row);
                });
            });
        }

        // 4. Helper for Status Cell (Admin vs Client View)
        function renderStatusCell(id, status, role) {
            if (role === "admin") {
                return `
                    <select onchange="updateStatus('${id}', this.value)">
                        <option value="pending" ${status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="working" ${status === 'working' ? 'selected' : ''}>Working</option>
                        <option value="done" ${status === 'done' ? 'selected' : ''}>Done</option>
                        <option value="denied" ${status === 'denied' ? 'selected' : ''}>Denied</option>
                    </select>
                `;
            } else {
                return `<span class="status-${status}" style="cursor:pointer" onclick="showStatusMsg('${status}')">${status.toUpperCase()}</span>`;
            }
        }

        // 5. Global Functions for Window Access
        window.updateStatus = async (id, newStatus) => {
            await updateDoc(doc(db, "proposals", id), { status: newStatus });
            alert("Status Updated Successfully!");
        };

        window.showStatusMsg = (status) => {
            const modal = document.getElementById('msgModal');
            const text = document.getElementById('statusText');
            if (statusMessages[status]) {
                const msgs = statusMessages[status];
                text.innerText = msgs[Math.floor(Math.random() * msgs.length)];
                modal.style.display = 'block';
            }
        };

        // 6. Logout Implementation
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                localStorage.clear();
                window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>
